<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Câmeras ao vivo</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="video.css">
</head>
<body>
  <div id="bar">
    <button id="back" title="Voltar ao mosaico (Esc)" hidden>&#9664; Mosaico</button>
    <span id="title">Câmeras ao vivo</span>
    <span class="badge" title="Vídeo ao vivo via componente HikTab, sem plugin do navegador">ao vivo</span>
    <span id="status"></span>
    <span class="spacer"></span>
    <button id="fotos" title="Abrir o modo mosaico de fotos (não precisa do componente)">Modo fotos</button>
    <button id="options" title="Endereço, usuário, senha e canais">Configurar</button>
  </div>
  <div id="grid"></div>
  <div id="msg" hidden></div>
  <button id="plugin" title="Abrir esta página com o plugin real da Hikvision (modo IE)" hidden>Usar plugin</button>
  <script src="digest.js"></script>
  <script src="video.js"></script>
</body>
</html>
